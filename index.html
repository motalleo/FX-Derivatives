  }

  function displayInputValue(field, value) {
    if (value === "" || value === null || value === undefined) return "";
    if (field.type === "percent") return String(Number(value) * 100);
    return String(value);
  }

  function selectedBusinessCurrency() {
    if (!currentState) return "";
    return currentState.sharedInputs.currency || currentState.sharedInputs.foreignCurrency || "";
  }

  function resolvedInputUnit(field) {
    const unit = field.unit || "";
    const currency = selectedBusinessCurrency();
    if (!currency) return unit;
    if (unit === "原币" || unit === "外币") return currency;
    if (unit === "CNY/外币") return `CNY/${currency}`;
    return unit;
  }

  function refreshDynamicInputUnits() {
    document.querySelectorAll("[data-input-unit]").forEach((node) => {
      node.textContent = resolvedInputUnit({ unit: node.dataset.unitTemplate || "" });
    });
  }

  function renderField(field, prefix, value, schemeId) {
    const id = `${prefix}-${field.id}`;
    const required = field.required ? `<span class="required-mark" aria-hidden="true">*</span>` : "";
    const dataAttrs = schemeId
      ? `data-scheme-id="${escapeHtml(schemeId)}" data-scheme-field="${escapeHtml(field.id)}"`
      : `data-shared-field="${escapeHtml(field.id)}"`;
    let control;
    if (field.type === "select") {
      control = `<select id="${id}" ${dataAttrs}>${(field.options || []).map((option) => `<option value="${escapeHtml(option)}" ${String(value) === String(option) ? "selected" : ""}>${escapeHtml(optionLabels[option] || option)}</option>`).join("")}</select>`;
    } else {
      const type = field.type === "date" ? "date" : "number";
      const unit = field.type === "percent" ? "%" : resolvedInputUnit(field);
      control = `<div class="input-shell"><input id="${id}" type="${type}" ${type === "number" ? 'inputmode="decimal" step="any"' : ""} value="${escapeHtml(displayInputValue(field, value))}" ${dataAttrs}><span data-input-unit="${escapeHtml(id)}" data-unit-template="${escapeHtml(field.type === "percent" ? "%" : field.unit || "")}">${escapeHtml(unit)}</span></div>`;
    }
    const help = field.help || (field.dynamicMarket
      ? `请输入本次测算采用的${field.label}。`
      : field.example !== undefined ? `可使用顶部的载入示例按钮填入。` : "");
    return `<div class="field" data-field-wrap="${id}"><label for="${id}">${escapeHtml(field.label)}${required}</label>${control}<p class="field-help">${escapeHtml(help)}</p><p class="field-error" data-error-for="${id}"></p></div>`;
  }

  function renderFieldCollection(fields, prefix, inputs, schemeId) {
    const regular = fields.filter((field) => !field.advanced);
    const advanced = fields.filter((field) => field.advanced);
    const render = (field) => renderField(field, prefix, inputs[field.id], schemeId);
    const regularHtml = `<div class="field-grid">${regular.map(render).join("")}</div>`;
    if (!advanced.length) return regularHtml;
    return `${regularHtml}<details class="advanced-fields"><summary>高级参数</summary><div class="field-grid">${advanced.map(render).join("")}</div></details>`;
  }

  function schemeLetter(index) {
    return String.fromCharCode(65 + index);
  }

  function renderAwaitingScenario() {
    nodes.sharedInputs.innerHTML = `<p class="no-shared">请先在上方选择“同一币种”或“不同币种”场景。</p>`;
    nodes.schemeTabs.hidden = true;
    nodes.mobileTabs.innerHTML = "";
    nodes.schemeInputs.innerHTML = "";
    nodes.addSchemeButton.hidden = true;
    nodes.exampleNotice.hidden = true;
    nodes.exampleState.textContent = "等待选择场景";
    document.getElementById("loadExampleButton").disabled = true;
    document.getElementById("calculateButton").disabled = true;
    nodes.resultArea.innerHTML = `<div class="result-placeholder"><span>1</span><h2>先确认业务结构</h2><p>选择场景后，页面只显示该结构需要的参数、结果和同场景比较。</p></div>`;
    nodes.schemeResultDetails.innerHTML = "";
    nodes.comparisonArea.hidden = true;
    nodes.comparisonArea.innerHTML = "";
    clearErrors();
  }

  function renderCalculator() {
    if (!currentProduct) return;
    nodes.calculatorHeader.innerHTML = `
      <div class="calculator-title-row"><div><p class="eyebrow">${escapeHtml(navigationApi.groupLabelFor(currentProduct))}</p><h1 id="calculatorTitle" tabindex="-1">${escapeHtml(currentProduct.name)}</h1></div><span class="source-badge">公式可追溯</span></div>
      <p class="calculator-intro">${escapeHtml(currentProduct.disclaimer)}</p>`;
    renderInternalScenarioSelector();
    if (!currentState) {
      renderAwaitingScenario();
      return;
    }
    document.getElementById("loadExampleButton").disabled = false;
    document.getElementById("calculateButton").disabled = false;
    nodes.sharedInputs.innerHTML = currentState.sharedFields.length
      ? renderFieldCollection(currentState.sharedFields, "shared", currentState.sharedInputs)
      : `<p class="no-shared">当前产品无共享字段，请直接录入方案参数。</p>`;
    renderSchemeTabs();
    nodes.schemeInputs.innerHTML = currentState.schemes.map((scheme, index) => `
      <section id="scheme-panel-${scheme.schemeId}" class="scheme-card" ${currentState.compareMode === "single" ? `role="region" aria-label="${escapeHtml(scheme.name)}"` : `role="tabpanel" aria-labelledby="scheme-tab-${scheme.schemeId}"`} data-scheme-card="${scheme.schemeId}" ${currentState.activeSchemeId === scheme.schemeId ? "" : "hidden"}>
        <div class="scheme-heading"><div><span>方案${schemeLetter(index)}</span><label class="sr-only" for="scheme-name-${scheme.schemeId}">方案名称</label><input id="scheme-name-${scheme.schemeId}" class="scheme-name-input" type="text" value="${escapeHtml(scheme.name)}" data-scheme-name="${scheme.schemeId}" aria-label="方案${schemeLetter(index)}名称"></div>
          ${canRemoveScheme() ? `<button type="button" class="remove-scheme" data-remove-scheme="${scheme.schemeId}" aria-label="删除方案${schemeLetter(index)}">删除</button>` : ""}
        </div>
        ${renderFieldCollection(scheme.fields, `scheme-${schemeLetter(index)}`, scheme.inputs, scheme.schemeId)}
      </section>`).join("");
    nodes.addSchemeButton.hidden = currentState.compareMode === "single";
    nodes.addSchemeButton.disabled = currentState.schemes.length >= currentState.maxSchemes;
    nodes.addSchemeButton.textContent = currentState.schemes.length >= currentState.maxSchemes ? "已达三个方案" : "添加方案";
    nodes.exampleNotice.hidden = !exampleLoaded;
    nodes.exampleState.textContent = exampleLoaded ? "当前为示例数据" : "当前为当次录入";
    clearErrors();
    renderResults();
    bindDynamicControls();
    refreshConditionalFields();
  }

  function canRemoveScheme() {
    const minimum = currentState.compareMode === "default" ? 2 : 1;
    return currentState.schemes.length > minimum;
  }

  function bindDynamicControls() {
    nodes.schemeInputs.querySelectorAll("[data-scheme-name]").forEach((control) => {
      control.addEventListener("change", () => {
        const scheme = currentState.schemes.find((item) => item.schemeId === control.dataset.schemeName);
        try {
          currentState = stateApi.renameScheme(currentState, control.dataset.schemeName, control.value);
          currentComparison = buildComparison();
          persistActiveScenarioSession();
          renderResults();
          renderSchemeTabs();
          showStatus("方案名称已更新");
        } catch (error) {
          control.value = scheme ? scheme.name : "";
          showStatus(error.message);
          control.focus();
        }
      });
    });
    nodes.schemeInputs.querySelectorAll("[data-remove-scheme]").forEach((button) => {
      button.addEventListener("click", () => {
        syncRawState();
        currentState = stateApi.removeScheme(currentState, button.dataset.removeScheme);
        currentComparison = buildComparison();
        persistActiveScenarioSession();
        renderCalculator();
      });
    });
    document.querySelectorAll("[data-shared-field], [data-scheme-field]").forEach((control) => {
      const eventName = control.tagName === "SELECT" ? "change" : "input";
      control.addEventListener(eventName, () => syncChangedControl(control));
    });
  }

  function renderSchemeTabs() {
    if (!currentState) return;
    const isSingle = currentState.compareMode === "single";
    nodes.schemeTabs.hidden = isSingle;
    if (isSingle) {
      nodes.mobileTabs.innerHTML = "";
      return;
    }
    nodes.mobileTabs.innerHTML = currentState.schemes.map((scheme, index) => `
      <button id="scheme-tab-${scheme.schemeId}" type="button" role="tab" data-scheme-tab="${scheme.schemeId}" aria-controls="scheme-panel-${scheme.schemeId}" aria-selected="${currentState.activeSchemeId === scheme.schemeId}" tabindex="${currentState.activeSchemeId === scheme.schemeId ? 0 : -1}"><span>方案${schemeLetter(index)}</span><strong>${escapeHtml(scheme.name)}</strong></button>`).join("");
    const tabs = Array.from(nodes.mobileTabs.querySelectorAll("[data-scheme-tab]"));
    tabs.forEach((button, index) => {
      button.addEventListener("click", () => selectScheme(button.dataset.schemeTab));
      button.addEventListener("keydown", (event) => {
        const positions = { ArrowLeft: index - 1, ArrowRight: index + 1, Home: 0, End: tabs.length - 1 };
        if (!Object.prototype.hasOwnProperty.call(positions, event.key)) return;
        event.preventDefault();
        const next = tabs[(positions[event.key] + tabs.length) % tabs.length];
        selectScheme(next.dataset.schemeTab, { focusTab: true });
      });
    });
  }

  function selectScheme(schemeId, options = { focusTab: false }) {
    if (!currentState) return;
    currentState = stateApi.selectScheme(currentState, schemeId);
    nodes.mobileTabs.querySelectorAll("[data-scheme-tab]").forEach((button) => {
      const selected = button.dataset.schemeTab === currentState.activeSchemeId;
      button.setAttribute("aria-selected", String(selected));
      button.tabIndex = selected ? 0 : -1;
    });
    nodes.schemeInputs.querySelectorAll("[data-scheme-card]").forEach((card) => {
      card.hidden = card.dataset.schemeCard !== currentState.activeSchemeId;
    });
    applyActiveSchemeDetail(currentState.activeSchemeId);
    if (options.focusTab) nodes.mobileTabs.querySelector(`[data-scheme-tab="${schemeId}"]`)?.focus();
  }

  function syncChangedControl(control) {
    if (!currentState || !control) return;
    let next = currentState;
    if (control.dataset.sharedField) {
      const field = currentState.sharedFields.find((item) => item.id === control.dataset.sharedField);
      if (field) next = stateApi.setSharedInput(currentState, field.id, controlValue(field, control));
    } else if (control.dataset.schemeField && control.dataset.schemeId) {
      const scheme = currentState.schemes.find((item) => item.schemeId === control.dataset.schemeId);
      const field = scheme && scheme.fields.find((item) => item.id === control.dataset.schemeField);
      if (field) next = stateApi.setSchemeInput(currentState, scheme.schemeId, field.id, controlValue(field, control));
    }
    if (next === currentState) return;
    currentState = next;
    currentComparison = null;
    exampleLoaded = false;
    persistActiveScenarioSession();
    refreshDynamicInputUnits();
    refreshConditionalFields();
    nodes.exampleNotice.hidden = true;
    nodes.exampleState.textContent = "当前为当次录入";
    renderResults();
    showStatus("参数已变更，请重新测算");
  }

  function revealAndFocusControl(control) {
    if (!control) return;
    const schemeId = control.dataset.schemeId;
    if (schemeId) selectScheme(schemeId);
    const details = control.closest("details");
    if (details) details.open = true;
    control.focus();
  }

  function controlValue(field, control) {
    const raw = control.value.trim();
    if (raw === "") return "";
    if (field.type === "select" || field.type === "date") return raw;
    const numeric = Number(raw);
    if (!Number.isFinite(numeric)) return raw;
    return field.type === "percent" ? numeric / 100 : numeric;
  }

  function syncRawState() {
    if (!currentState) return;
    let next = currentState;
    for (const field of next.sharedFields) {
      const control = document.querySelector(`[data-shared-field="${field.id}"]`);
      if (control) next = stateApi.setSharedInput(next, field.id, controlValue(field, control));
    }
    for (const scheme of next.schemes) {
      for (const field of scheme.fields) {
        const control = document.querySelector(`[data-scheme-id="${scheme.schemeId}"][data-scheme-field="${field.id}"]`);
        if (control) next = stateApi.setSchemeInput(next, scheme.schemeId, field.id, controlValue(field, control));
      }
    }
    currentState = next;
  }

  function clearErrors() {
    nodes.errorSummary.hidden = true;
    nodes.errorSummary.innerHTML = "";
    document.querySelectorAll(".field-error").forEach((node) => { node.textContent = ""; });
    document.querySelectorAll(".invalid").forEach((node) => node.classList.remove("invalid"));
  }

  function conditionMatches(condition, inputs) {
    if (!condition || typeof condition !== "object") return true;
    const actual = inputs[condition.field];
    if (condition.operator === "equals") return actual === condition.value;
    if (condition.operator === "notEquals") return actual !== condition.value;
    if (condition.operator === "lessThan") return Number(actual) < Number(condition.value);
    if (condition.operator === "greaterThan") return Number(actual) > Number(condition.value);
    return false;
  }

  function fieldIsRelevant(calculator, field, inputs) {
    const fieldId = field.id;
    if (field.visibleWhen && !conditionMatches(field.visibleWhen, inputs)) return false;
    if (calculator === "huizengli" && fieldId === "premiumPerUnit") return inputs.premiumMode === "pips";
    if (calculator === "huizengli" && fieldId === "premiumCny") return inputs.premiumMode === "amount";
    if (calculator === "swapDeposit" && fieldId === "forwardRate") return inputs.forwardMode === "manual";
    if (calculator === "enhancedForward" && fieldId === "addRate") return inputs.addMode === "price";
    if (calculator === "enhancedForward" && fieldId === "addPips") return inputs.addMode === "pips";
    return true;
  }

  function conditionalRequired(calculator, field, inputs) {
    const fieldId = field.id;
    if (field.requiredWhen) return conditionMatches(field.requiredWhen, inputs);
    if (calculator === "huizengli" && fieldId === "premiumPerUnit") return inputs.premiumMode === "pips";
    if (calculator === "huizengli" && fieldId === "premiumCny") return inputs.premiumMode === "amount";
    if (calculator === "swapDeposit" && fieldId === "forwardRate") return inputs.forwardMode === "manual";
    if (calculator === "enhancedForward" && fieldId === "addRate") return inputs.addMode === "price";
    if (calculator === "enhancedForward" && fieldId === "addPips") return inputs.addMode === "pips";
    return false;
  }

  function refreshConditionalFields() {
    if (!currentState) return;
    const sharedInputs = { ...currentState.sharedInputs };
    for (const field of currentState.sharedFields) {
      const control = document.querySelector(`[data-shared-field="${field.id}"]`);
      if (!control) continue;
      const wrapper = control.closest(".field");
      const relevant = fieldIsRelevant(currentState.defaultCalculator, field, sharedInputs);
      wrapper.hidden = !relevant;
      if (!relevant) {
        control.classList.remove("invalid");
        wrapper.querySelector(".field-error").textContent = "";
      }
    }
    for (const scheme of currentState.schemes) {
      const inputs = { ...sharedInputs, ...scheme.inputs };
      for (const field of scheme.fields) {
        const control = document.querySelector(`[data-scheme-id="${scheme.schemeId}"][data-scheme-field="${field.id}"]`);
        if (!control) continue;
        const wrapper = control.closest(".field");
        const relevant = fieldIsRelevant(scheme.calculator, field, inputs);
        wrapper.hidden = !relevant;
        if (!relevant) {
          control.classList.remove("invalid");
          wrapper.querySelector(".field-error").textContent = "";
        }
      }
      document.querySelectorAll(`[data-scheme-card="${scheme.schemeId}"] .advanced-fields`).forEach((details) => {
        details.hidden = Array.from(details.querySelectorAll(".field")).every((fieldNode) => fieldNode.hidden);
      });
    }
  }

  function validateControl(field, control, required) {
    const raw = control.value.trim();
    if (raw === "") return required ? `请填写${field.label}` : "";
    if (field.type === "select" || field.type === "date") return "";
    const value = Number(raw);
    if (!Number.isFinite(value)) return `${field.label}必须是有效数字`;
    const internal = field.type === "percent" ? value / 100 : value;
    if (field.minExclusive !== undefined && internal <= field.minExclusive) return `${field.label}必须大于${field.minExclusive}`;
    if (field.min !== undefined && internal < field.min) return `${field.label}不能小于${field.min}`;
    if (field.max !== undefined && internal > field.max) return `${field.label}不能大于${field.type === "percent" ? field.max * 100 : field.max}`;
    return "";
  }

  function collectValidatedState() {
    clearErrors();
    const errors = [];
    let next = currentState;
    const sharedValues = {};
    for (const field of next.sharedFields) {
      const control = document.querySelector(`[data-shared-field="${field.id}"]`);
      sharedValues[field.id] = controlValue(field, control);
    }
    for (const field of next.sharedFields) {
      const control = document.querySelector(`[data-shared-field="${field.id}"]`);
      const relevant = fieldIsRelevant(next.defaultCalculator, field, sharedValues);
      const message = relevant ? validateControl(field, control, field.required || conditionalRequired(next.defaultCalculator, field, sharedValues)) : "";
      if (message) errors.push({ control, message });
      next = stateApi.setSharedInput(next, field.id, sharedValues[field.id]);
    }
    for (const scheme of next.schemes) {
      const modeInputs = { ...sharedValues };
      for (const field of scheme.fields) {
        const control = document.querySelector(`[data-scheme-id="${scheme.schemeId}"][data-scheme-field="${field.id}"]`);
        modeInputs[field.id] = controlValue(field, control);
      }
      for (const field of scheme.fields) {
        const control = document.querySelector(`[data-scheme-id="${scheme.schemeId}"][data-scheme-field="${field.id}"]`);
        const relevant = fieldIsRelevant(scheme.calculator, field, modeInputs);
        const message = relevant ? validateControl(field, control, field.required || conditionalRequired(scheme.calculator, field, modeInputs)) : "";
        if (message) errors.push({ control, message });
        next = stateApi.setSchemeInput(next, scheme.schemeId, field.id, controlValue(field, control));
      }
    }
    if (errors.length) {
      for (const error of errors) {
        error.control.classList.add("invalid");
        const node = document.querySelector(`[data-error-for="${error.control.id}"]`);
        if (node) node.textContent = error.message;
      }
      nodes.errorSummary.innerHTML = `<strong>请检查 ${errors.length} 项输入</strong><ul>${errors.map((error) => `<li>${escapeHtml(error.message)}</li>`).join("")}</ul>`;
      nodes.errorSummary.hidden = false;
      revealAndFocusControl(errors[0].control);
      return null;
    }
    return next;
  }

  function calculatorInput(sharedInputs, scheme) {
    const allValues = { ...sharedInputs, ...scheme.inputs };
    const values = {};
    for (const field of currentState.sharedFields) {
      if (fieldIsRelevant(scheme.calculator, field, allValues)) values[field.id] = sharedInputs[field.id];
    }
    for (const field of scheme.fields) {
      if (fieldIsRelevant(scheme.calculator, field, allValues)) values[field.id] = scheme.inputs[field.id];
    }
    if (scheme.calculator === "ruyihui" && values.amountTenThousands !== undefined) {
      values.contractAmountTenThousands = values.amountTenThousands;
    }
    return values;
  }

  function calculateAll() {
    const validated = collectValidatedState();
    if (!validated) return;
    try {
      currentState = batchApi.calculateAll(validated, calculators, {
        buildInput: (state, scheme) => calculatorInput(state.sharedInputs, scheme),
        validateResult: (result) => presentationApi.buildResultViewModel(currentProductView, result)
      });
      currentComparison = buildComparison();
      persistActiveScenarioSession();
      renderResults();
      showStatus("测算已更新");
      nodes.resultArea.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (error) {
      nodes.errorSummary.innerHTML = `<strong>无法完成测算</strong><p>${escapeHtml(error.message)}。请检查对应参数后重试。</p>`;
      nodes.errorSummary.hidden = false;
      if (error.schemeId) selectScheme(error.schemeId);
      let control = null;
      if (error.schemeId && error.scope && error.fieldId) {
        control = error.scope === "shared"
          ? document.querySelector(`[data-shared-field="${error.fieldId}"]`)
          : error.scope === "scheme"
            ? document.querySelector(`[data-scheme-id="${error.schemeId}"][data-scheme-field="${error.fieldId}"]`)
            : null;
      }
      if (control) {
        control.classList.add("invalid");
        const fieldError = document.querySelector(`[data-error-for="${control.id}"]`);
        if (fieldError) fieldError.textContent = error.message;
        revealAndFocusControl(control);
      } else {
        nodes.errorSummary.focus();
      }
    }
  }

  function buildComparison() {
    if (currentState.schemes.length < 2 || currentState.schemes.some((scheme) => !scheme.result)) return null;
    try {
      const normalized = currentState.schemes.map((scheme) => comparisonApi.normalize(currentProductView, scheme, scheme.result));
      return comparisonApi.compare(currentProductView, normalized);
    } catch (error) {
      return { available: false, reason: error.message, rows: [] };
    }
  }

  function isMonetaryEntry(entry) {
    return /^(?:万 )?(CNY|USD|EUR|HKD|JPY|GBP|AUD|CAD|CHF|原币|外币)$/.test(entry.unit || "");
  }

  function renderBreakdown(groups) {
    const labels = { income: "收益", cost: "成本", cashflow: "现金流", price: "价格" };
    const visibleGroups = (groups || []).filter((group) => group.entries && group.entries.length);
    if (!visibleGroups.length) return "";
    return `<div class="breakdown-grid">${visibleGroups.map((group) => {
      const items = group.entries;
      const maxByUnit = new Map();
      for (const entry of items) {
        if (!isMonetaryEntry(entry) || typeof entry.value !== "number" || !Number.isFinite(entry.value)) continue;
        maxByUnit.set(entry.unit, Math.max(maxByUnit.get(entry.unit) || 0, Math.abs(entry.value)));
      }
      return `<section class="breakdown-group" data-breakdown-group="${group.id}"><h4>${labels[group.id] || group.label}</h4>${items.map((entry) => {
        const max = maxByUnit.get(entry.unit) || 0;
        const showBar = isMonetaryEntry(entry) && typeof entry.value === "number" && Number.isFinite(entry.value) && entry.value !== 0 && max > 0;
        const width = showBar ? Math.abs(entry.value) / max * 100 : 0;
        return `<div class="breakdown-row"><div><span>${escapeHtml(entry.label)}</span><strong>${escapeHtml(presentationApi.formatResultEntry(entry))}</strong></div>${showBar ? `<div class="composition-track" aria-hidden="true"><i style="width:${width.toFixed(2)}%"></i></div>` : ""}</div>`;
      }).join("")}</section>`;
    }).join("")}</div>`;
  }

  function renderMaturityScenarios(maturityScenarios) {
    if (!Array.isArray(maturityScenarios) || !maturityScenarios.length) {
      const pendingProducts = new Set(["huizengli", "dual-currency-forward", "ruyihui", "single-call-option"]);
      return pendingProducts.has(currentProduct.id)
        ? `<div class="scenario-list scenario-pending"><h4>到期情景边界</h4><p>本版仅展示已确认且可复算的结果；到期交割条件尚未登记，不作推断。</p></div>`
        : "";
    }
    const detail = (item) => {
      const rows = [];
      if (Number.isFinite(item.settlementRate)) rows.push(`结算价 ${item.settlementRate.toFixed(4)}`);
      if (typeof item.settlementRule === "string" && item.settlementRule) rows.push(`结算规则 ${item.settlementRule === "maturitySpot" ? "按到期即期汇率" : item.settlementRule}`);
      if (Number.isFinite(item.profitCny)) rows.push(`情景收益 ${item.profitCny.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} CNY`);
      if (typeof item.notionalText === "string" && item.notionalText) rows.push(`名义本金 ${item.notionalText}`);
      if (Number.isFinite(item.notionalMultiple)) rows.push(`名义本金倍数 ${item.notionalMultiple.toLocaleString("zh-CN", { maximumFractionDigits: 2 })} 倍`);
      return rows.map((row) => `<small>${escapeHtml(row)}</small>`).join("");
    };
    return `<div class="scenario-list"><h4>到期情景</h4><p>到期情景仅按当前假设输入展示，不构成报价或审批结论。</p><div>${maturityScenarios.map((item, index) => `<article><span>情景 ${index + 1}</span><strong>${escapeHtml(scenarioConditionLabels[item.condition] || item.condition || "按结构条件执行")}</strong>${detail(item)}</article>`).join("")}</div></div>`;
  }

  function renderCashflowTimeline(timeline) {
    if (!Array.isArray(timeline) || !timeline.some((entry) => entry && (entry.date || entry.label))) return "";
    return `<section class="cashflow-timeline"><h4>现金流时间轴</h4><ol>${timeline.map((entry) => {
      if (!entry || (!entry.date && !entry.label)) return "";
      const amount = typeof entry.amount === "number" && Number.isFinite(entry.amount)
        ? `<b>${escapeHtml(presentationApi.formatResultEntry({ value: entry.amount, unit: entry.unit || "" }))}</b>`
        : "";
      return `<li data-timeline-group="${escapeHtml(entry.group || "cashflow")}"><time>${escapeHtml(entry.date || "日期待确认")}</time><div><strong>${escapeHtml(entry.label || "现金流节点")}</strong>${entry.detail ? `<small>${escapeHtml(entry.detail)}</small>` : ""}${amount}</div></li>`;
    }).join("")}</ol></section>`;
  }

  function renderWarnings(warnings) {
    if (!Array.isArray(warnings) || !warnings.length) return "";
    return `<div class="result-warnings" role="note"><strong>边界提示</strong><ul>${warnings.map((warning) => `<li>${escapeHtml(warning)}</li>`).join("")}</ul></div>`;
  }

  function buildSchemeModels() {
    return currentState.schemes.map((scheme) => ({
      schemeId: scheme.schemeId,
      name: scheme.name,
      result: scheme.result,
      model: scheme.result ? presentationApi.buildResultViewModel(currentProductView, scheme.result) : null
    }));
  }

  function renderResults() {
    if (!currentState) return;
    const schemeModels = buildSchemeModels();
    renderResultSummary(schemeModels);
    renderSchemeDetails(schemeModels);
    applyActiveSchemeDetail(currentState.activeSchemeId);
    const comparisonModel = currentComparison
      ? presentationApi.buildComparisonViewModel(currentProductView, schemeModels, currentComparison, currentState.baselineSchemeId)
      : null;
    renderComparison(comparisonModel);
  }

  function renderResultSummary(schemeModels) {
    const modelsByScheme = new Map(schemeModels.map((scheme) => [scheme.schemeId, scheme.model]));
    nodes.resultArea.innerHTML = `<div class="section-title"><div><p class="eyebrow">试算输出</p><h2>方案摘要</h2></div><span>${currentState.schemes.length} 个方案</span></div>
      <div class="result-summary-grid" data-scheme-count="${currentState.schemes.length}">${currentState.schemes.map((scheme, index) => {
        const model = modelsByScheme.get(scheme.schemeId);
        if (!model) {
          return `<button type="button" class="result-summary-card pending" data-result-summary-scheme="${scheme.schemeId}" data-result-state="pending"><span class="result-summary-index">方案${schemeLetter(index)}</span><strong class="result-summary-name">${escapeHtml(scheme.name)}</strong><span class="result-summary-pending">待重新测算</span><span class="result-summary-link">查看拆解</span></button>`;
        }
        return `<button type="button" class="result-summary-card" data-result-summary-scheme="${scheme.schemeId}" data-result-state="ready" data-metric-group="${escapeHtml(model.primary.group || "price")}"><span class="result-summary-index">方案${schemeLetter(index)}</span><strong class="result-summary-name">${escapeHtml(scheme.name)}</strong><span class="result-summary-primary"><small>${escapeHtml(model.primary.label)}</small><strong>${escapeHtml(presentationApi.formatResultEntry(model.primary))}</strong></span><span class="result-summary-secondary">${model.secondary.map((entry) => `<span data-metric-group="${escapeHtml(entry.group || "price")}"><small>${escapeHtml(entry.label)}</small><strong>${escapeHtml(presentationApi.formatResultEntry(entry))}</strong></span>`).join("")}</span><span class="result-summary-link">查看拆解</span></button>`;
      }).join("")}</div>`;
    nodes.resultArea.querySelectorAll("[data-result-summary-scheme]").forEach((button) => {
      button.addEventListener("click", () => selectScheme(button.dataset.resultSummaryScheme));
    });
  }

  function renderSchemeDetails(schemeModels) {
    const modelsByScheme = new Map(schemeModels.map((scheme) => [scheme.schemeId, scheme.model]));
    nodes.schemeResultDetails.innerHTML = currentState.schemes.map((scheme, index) => {
      const model = modelsByScheme.get(scheme.schemeId);
      if (!model) {
        return `<article id="result-detail-${scheme.schemeId}" class="scheme-result scheme-detail scheme-result-detail pending" data-scheme-detail="${scheme.schemeId}" data-result-detail-scheme="${scheme.schemeId}" ${currentState.activeSchemeId === scheme.schemeId ? "" : "hidden"}><div class="result-heading"><span>方案${schemeLetter(index)}</span><h3>${escapeHtml(scheme.name)}</h3></div><div class="detail-pending"><strong>待重新测算</strong><p>当前方案参数已变更，请完成测算后查看拆解。</p></div></article>`;
      }
      return `<article id="result-detail-${scheme.schemeId}" class="scheme-result scheme-detail scheme-result-detail" data-scheme-detail="${scheme.schemeId}" data-result-detail-scheme="${scheme.schemeId}" ${currentState.activeSchemeId === scheme.schemeId ? "" : "hidden"}>
        <div class="result-heading"><span>方案${schemeLetter(index)}</span><h3>${escapeHtml(scheme.name)}</h3></div>
        <div class="metric-grid"><div class="metric-card primary" data-metric-group="${escapeHtml(model.primary.group || "price")}"><span>${escapeHtml(model.primary.label)}</span><strong>${escapeHtml(presentationApi.formatResultEntry(model.primary))}</strong></div>${model.secondary.map((entry) => `<div class="metric-card secondary" data-metric-group="${escapeHtml(entry.group || "price")}"><span>${escapeHtml(entry.label)}</span><strong>${escapeHtml(presentationApi.formatResultEntry(entry))}</strong></div>`).join("")}</div>
        ${renderWarnings(model.warnings)}${renderBreakdown(model.groups)}${renderCashflowTimeline(model.cashflowTimeline)}${renderMaturityScenarios(model.maturityScenarios)}
        <div class="result-boundary"><h4>使用边界</h4><p>${escapeHtml(currentProductView.disclaimer)}</p></div>
        <p class="formula-version">公式版本 V2 2026-08-05：${escapeHtml(currentProductView.formulaIds.join("、"))}</p>
      </article>`;
    }).join("");
  }

  function applyActiveSchemeDetail(activeSchemeId) {
    nodes.schemeResultDetails.querySelectorAll("[data-scheme-detail]").forEach((detail) => {
      detail.hidden = detail.dataset.schemeDetail !== activeSchemeId;
    });
  }

  function renderComparison(comparisonModel) {
    if (!comparisonModel) {
      nodes.comparisonArea.hidden = true;
      nodes.comparisonArea.innerHTML = `<p>参数已变更，请重新测算后查看方案差额。</p>`;
      return;
    }
    nodes.comparisonArea.hidden = false;
    const baselineName = comparisonModel.baseline ? comparisonModel.baseline.name : "当前基准";
    nodes.comparisonArea.innerHTML = `<div class="section-title"><div><p class="eyebrow">同场景比较</p><h2 id="comparisonHeading">方案差额（相对${escapeHtml(baselineName)}）</h2></div></div>
      <p class="comparison-disclaimer">路径比较仅反映当前假设参数下的测算差异，不代表产品推荐。</p>
      ${comparisonModel.reason ? `<div class="comparison-notice">${escapeHtml(comparisonModel.reason)}</div>` : ""}
      ${comparisonModel.available ? `<div class="comparison-table" role="table" aria-label="方案逐指标比较">${comparisonModel.rows.map((row) => `<div class="comparison-row" role="row" data-comparison-key="${escapeHtml(row.key)}"><div class="comparison-metric" role="rowheader"><strong>${escapeHtml(row.label)}</strong>${row.unit ? `<small>${escapeHtml(row.unit)}</small>` : ""}</div><div class="comparison-values" role="cell" style="--comparison-columns:${comparisonModel.columns.length}">${row.values.map((value) => {
        const column = comparisonModel.columns.find((item) => item.schemeId === value.schemeId);
        const isBaseline = comparisonModel.baseline && comparisonModel.baseline.schemeId === value.schemeId;
        return `<div class="comparison-value" data-comparison-value="${escapeHtml(value.schemeId)}" data-baseline="${isBaseline}"><span>${escapeHtml(column ? column.name : "方案")}</span><strong>${escapeHtml(value.formatted || "未提供")}</strong><small class="comparison-delta">${escapeHtml(value.deltaText)}</small></div>`;
      }).join("")}</div></div>`).join("")}</div>` : `<div class="comparison-unavailable">${escapeHtml(comparisonModel.reason)}</div>`}`;
  }

  function loadExamples() {
    syncRawState();
    let next = currentState;
    for (const field of next.sharedFields) {
      if (Object.prototype.hasOwnProperty.call(field, "example")) next = stateApi.setSharedInput(next, field.id, field.example);
    }
    for (const scheme of next.schemes) {
      for (const field of scheme.fields) {
        if (Object.prototype.hasOwnProperty.call(field, "example")) next = stateApi.setSchemeInput(next, scheme.schemeId, field.id, field.example);
      }
    }
    currentState = next;
    currentComparison = null;
    exampleLoaded = true;
    persistActiveScenarioSession();
    renderCalculator();
    showStatus("已载入示例数据");
  }

  function addScheme() {
    try {
      syncRawState();
      currentState = stateApi.addScheme(currentState);
      currentComparison = null;
      persistActiveScenarioSession();
      renderCalculator();
    } catch (error) {
      showStatus(error.message);
    }
  }

  function showStatus(message) {
    nodes.status.textContent = message;
    nodes.status.classList.add("visible");
    window.setTimeout(() => nodes.status.classList.remove("visible"), 1800);
  }

  document.getElementById("calculatorForm").addEventListener("submit", (event) => {
    event.preventDefault();
    calculateAll();
  });
  document.getElementById("homeButton").addEventListener("click", () => {
    if (window.matchMedia("(max-width: 1100px)").matches) {
      setProductNavOpen(true);
      return;
    }
    nodes.productSearch.focus();
  });
  document.getElementById("loadExampleButton").addEventListener("click", loadExamples);
  document.getElementById("addSchemeButton").addEventListener("click", addScheme);
  nodes.productSearch.addEventListener("input", renderProductNavigation);
  nodes.productSearch.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (nodes.productSearch.value) {
      nodes.productSearch.value = "";
      renderProductNavigation();
      return;
    }
    setProductNavOpen(false, { restoreFocus: true });
  });
  nodes.mobileProductNavButton.addEventListener("click", () => setProductNavOpen(true));
  nodes.closeProductNavigation.addEventListener("click", () => setProductNavOpen(false, { restoreFocus: true }));
  nodes.productNavScrim.addEventListener("click", () => setProductNavOpen(false, { restoreFocus: true }));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && document.body.classList.contains("product-nav-open")) {
      setProductNavOpen(false, { restoreFocus: true });
    }
  });

  function init() {
    const initialProductId = navigationApi.resolveInitialProductId(products, storedProductId());
    openProduct(initialProductId, { focus: false, scroll: false });
  }

  root.ToolboxApp = { init, openProduct, selectInternalScenario, calculateAll, loadExamples };
  init();
})(globalThis);
</script>
</body>
</html>
