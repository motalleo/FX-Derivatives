<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>产品测算工具箱</title>
  <style>:root {
  --page: #f3f5f7;
  --surface: #ffffff;
  --surface-soft: #f7f8fa;
  --surface-raised: #ffffff;
  --text: #132238;
  --text-strong: #0b1f33;
  --muted: #5f6b7a;
  --muted-light: #7b8794;
  --line: #dde2e8;
  --line-strong: #b8c1cc;
  --accent: #163a63;
  --accent-hover: #0f2d4e;
  --accent-soft: #edf3f8;
  --brand: #c8102e;
  --brand-soft: #fbedf0;
  --danger: #b42318;
  --success: #18794e;
  --income: #18794e;
  --income-soft: #edf8f2;
  --cost: #b42318;
  --cost-soft: #fff1ef;
  --cashflow: #1769aa;
  --cashflow-soft: #edf5fc;
  --price: #6656c9;
  --price-soft: #f2f0fc;
  --nav-width: 280px;
  --radius-panel: 18px;
  --radius-input: 12px;
  --shadow-panel: 0 1px 2px rgba(15, 31, 51, .04), 0 10px 30px rgba(15, 31, 51, .05);
  --shadow-focus: 0 0 0 3px rgba(22, 58, 99, .16);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--page); scroll-behavior: smooth; }
body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
  color: var(--text);
  background: var(--page);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.55;
  letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(22, 58, 99, .28);
  outline-offset: 2px;
}
[hidden] { display: none !important; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 64px;
  padding-inline: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: rgba(255, 255, 255, .98);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(15, 31, 51, .02);
}
.brand {
  min-width: 0;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: 0;
}
.brand strong { display: block; color: var(--text-strong); font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.topbar-title { position: absolute; left: 50%; color: var(--text-strong); font-size: 16px; font-weight: 760; letter-spacing: -.02em; transform: translateX(-50%); }
.mobile-product-nav-button { display: none; min-width: 0; padding: 6px 10px; color: var(--text); text-align: right; background: transparent; border: 0; border-radius: 10px; }
.mobile-product-nav-button span, .mobile-product-nav-button strong { display: block; }
.mobile-product-nav-button span { color: var(--muted); font-size: 9px; font-weight: 500; }
.mobile-product-nav-button strong { max-width: 150px; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.search-field {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-input);
}
.search-field:focus-within { background: #fff; border-color: var(--accent); box-shadow: var(--shadow-focus); }
.search-field input { width: 100%; min-width: 0; color: var(--text); background: transparent; border: 0; outline: 0; }

.eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 760; letter-spacing: .07em; }
.toolbox-workspace { min-height: calc(100vh - 64px); display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr); align-items: start; }
.product-navigation {
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  background: #fbfcfd;
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.product-navigation-head { flex: none; padding: 22px 18px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.product-navigation-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.product-navigation-head .eyebrow { margin-bottom: 3px; color: var(--brand); font-size: 10px; }
.product-navigation-head h1 { margin: 0; color: var(--text-strong); font-size: 22px; letter-spacing: -.035em; }
.product-navigation-head > p { margin: 7px 0 15px; color: var(--muted); font-size: 11px; }
.close-product-navigation { display: none; min-height: 40px; padding: 0 8px; color: var(--accent); background: transparent; border: 0; }
.product-nav-content { flex: 1; padding: 10px 10px 18px; overflow-y: auto; overscroll-behavior: contain; }
.product-nav-group { border-bottom: 1px solid #e8ecf0; }
.product-nav-group:last-child { border-bottom: 0; }
.product-nav-group summary { min-height: 46px; padding: 11px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #405066; cursor: pointer; list-style: none; font-size: 12px; font-weight: 720; letter-spacing: .01em; }
.product-nav-group summary::-webkit-details-marker { display: none; }
.product-nav-group summary small { min-width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); background: #eef1f4; border-radius: 999px; font-size: 10px; }
.product-nav-items { padding: 0 0 9px; }
.product-nav-subgroup + .product-nav-subgroup { margin-top: 6px; }
.product-nav-subgroup-label { padding: 6px 12px 4px; color: var(--muted-light); font-size: 10px; font-weight: 700; letter-spacing: .07em; }
.product-nav-item { width: 100%; min-height: 44px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #243247; text-align: left; background: transparent; border: 0; border-radius: 11px; font-size: 14px; transition: color .18s ease, background-color .18s ease, box-shadow .18s ease; }
button.product-nav-item:hover { background: #f0f3f6; }
button.product-nav-item.active { color: #9f0d27; background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); font-weight: 720; }
.product-nav-item.pending { color: #9a9aa1; cursor: not-allowed; }
.product-nav-item.pending small { flex: none; padding: 2px 5px; color: #8a6a22; background: #fff5d8; border-radius: 999px; font-size: 8px; }
.product-nav-empty { padding: 28px 12px; color: var(--muted); text-align: center; font-size: 11px; }
.product-nav-boundary { flex: none; margin: 0; padding: 13px 18px; color: var(--muted-light); background: var(--surface); border-top: 1px solid var(--line); font-size: 10px; }
.product-nav-scrim { display: none; }
.calculator-view { min-width: 0; width: 100%; }
.calculator-shell { width: 100%; max-width: 1720px; margin: 0 auto; padding: 30px clamp(22px, 2.8vw, 48px) 72px; }
.print-title { display: none; }
.calculator-header { padding: 0 2px 22px; }
.calculator-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.calculator-title-row h1 { margin: 0; color: var(--text-strong); font-size: clamp(32px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -.045em; }
.source-badge { padding: 6px 10px; color: var(--success); background: var(--income-soft); border: 1px solid #cfe9da; border-radius: 999px; font-size: 11px; white-space: nowrap; }
.calculator-intro { max-width: 820px; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.internal-scenario-section { margin-top: 16px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); box-shadow: var(--shadow-panel); }
.internal-scenario-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
.internal-scenario-heading .eyebrow { margin-bottom: 3px; color: var(--brand); font-size: 10px; }
.internal-scenario-heading h2 { margin: 0; color: var(--text-strong); font-size: 19px; letter-spacing: -.025em; }
.internal-scenario-heading small { max-width: 360px; color: var(--muted); text-align: right; font-size: 10px; }
.internal-scenario-options { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.internal-scenario-option { min-height: 96px; padding: 15px 16px; color: var(--text); text-align: left; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 15px; transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease; }
.internal-scenario-option:hover { border-color: #aab7c4; background: #fff; }
.internal-scenario-option span, .internal-scenario-option strong, .internal-scenario-option small { display: block; }
.internal-scenario-option span { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .06em; }
.internal-scenario-option strong { margin-top: 5px; color: var(--text-strong); font-size: 15px; }
.internal-scenario-option small { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.internal-scenario-option[aria-checked="true"] { color: #8f0c23; background: var(--brand-soft); border-color: #dea2af; box-shadow: inset 0 0 0 1px rgba(200,16,46,.08); }
.internal-scenario-option[aria-checked="true"] strong { color: #8f0c23; }
.scenario-structure-summary { margin: 13px 0 0; padding: 11px 13px; color: #405066; background: var(--surface-soft); border: 1px solid #e7ebef; border-radius: 11px; font-size: 11px; }
.current-scenario-print { display: none; }
.workbench-actions { margin-top: 12px; min-height: 48px; padding: 7px; display: flex; align-items: center; gap: 8px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 14px; }
.workbench-actions:not(:has(.button:not([hidden]))) { display: none; }
.button { min-height: 42px; padding: 9px 16px; border: 1px solid transparent; border-radius: 12px; font-weight: 680; transition: color .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease; touch-action: manipulation; }
.button.primary { color: #fff; background: var(--accent); box-shadow: 0 6px 16px rgba(22, 58, 99, .16); }
.button.primary:hover { background: var(--accent-hover); }
.button.secondary { color: var(--accent); background: var(--accent-soft); border-color: #d6e1eb; }
.button.secondary:hover { background: #e4edf5; border-color: #c2d2df; }
.button.ghost { color: var(--text); background: #fff; border-color: var(--line); }
.button:disabled { cursor: not-allowed; opacity: .46; box-shadow: none; }
.example-notice { margin-top: 10px; padding: 11px 14px; color: #6a4a00; background: #fff7df; border: 1px solid #ead49b; border-radius: 12px; font-size: 12px; }
.mobile-segments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mobile-segments button {
  min-width: 0;
  min-height: 52px;
  padding: 8px 10px;
  color: var(--muted);
  text-align: left;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.mobile-segments button span, .mobile-segments button strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mobile-segments button span { font-size: 9px; letter-spacing: .06em; }
.mobile-segments button strong { margin-top: 2px; font-size: 11px; }
.mobile-segments button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: #b9d7f5; }
.workspace-grid { margin-top: 16px; display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel-card, .scheme-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); }
.shared-panel { position: sticky; top: 80px; padding: 18px; }
.measurement-workbench {
  margin-top: 16px;
  display: grid;
  grid-template-columns: minmax(360px, 420px) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.input-pane { min-width: 0; position: sticky; top: 80px; padding: 22px; box-shadow: var(--shadow-panel); }
.result-pane { min-width: 0; }
.product-context { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.product-context .calculator-header { padding: 0; }
.shared-input-section { padding: 16px 0; }
.shared-input-section h2 { margin: 0 0 12px; font-size: 15px; }
.input-pane .field-grid { grid-template-columns: 1fr; }
.scheme-tabs { margin: 0 0 12px; }
#schemeInputs { display: block; }
.scheme-card[hidden], .scheme-result-detail[hidden] { display: none !important; }
.example-row { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.example-row span, #inputGuidance { color: var(--muted); font-size: 11px; }
.input-pane .submit-row { margin-top: 12px; padding: 0; display: block; background: transparent; }
#calculateButton { width: 100%; min-height: 48px; }
#inputGuidance { margin: 10px 0 0; }
.result-pane .result-area { margin-top: 0; }
.scheme-result-details:empty { display: none; }
.panel-heading { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel-heading span { color: var(--text-strong); font-size: 16px; font-weight: 760; }
.panel-heading small { color: var(--muted); font-size: 10px; }
.scheme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.scheme-card { min-width: 0; padding: 20px; box-shadow: 0 1px 2px rgba(15,31,51,.03); }
.scheme-heading { min-height: 52px; margin-bottom: 18px; display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.scheme-heading span { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .08em; }
.scheme-name-input { display: block; width: min(100%, 360px); margin: 0 0 10px -8px; padding: 2px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 18px; font-weight: 700; line-height: 1.4; }
.scheme-name-input:hover { border-color: var(--line); }
.scheme-name-input:focus-visible { border-color: var(--accent); background: var(--surface); outline: 3px solid rgba(0, 102, 204, 0.28); }
.remove-scheme { align-self: flex-start; padding: 4px 0; color: var(--danger); background: transparent; border: 0; font-size: 11px; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 12px; }
.shared-panel .field-grid { grid-template-columns: 1fr; }
.field { min-width: 0; }
.field label { margin-bottom: 7px; display: block; color: #28374a; font-size: 13px; font-weight: 680; }
.required-mark { margin-left: 3px; color: var(--brand); }
.field input, .field select {
  width: 100%;
  height: 46px;
  padding: 0 12px;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-input);
}
.field input { border: 0; }
.input-shell { height: 46px; padding-right: 11px; display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-input); background: #fff; overflow: hidden; transition: border-color .18s ease, box-shadow .18s ease; }
.input-shell:focus-within { border-color: var(--accent); box-shadow: var(--shadow-focus); }
.input-shell span { flex: none; color: var(--muted); font-size: 11px; }
.field select:focus { border-color: var(--accent); box-shadow: var(--shadow-focus); outline: 0; }
.field input.invalid, .field select.invalid, .input-shell:has(input.invalid) { border-color: var(--danger); background: #fff4f2; }
.field-help, .field-error { min-height: 16px; margin: 5px 0 0; font-size: 11px; line-height: 1.45; }
.field-help { color: var(--muted); }
.field-error { color: var(--danger); font-weight: 650; }
.no-shared { margin: 0; color: var(--muted); font-size: 12px; }
.advanced-fields { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); }
.advanced-fields summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 700; }
.advanced-fields .field-grid { margin-top: 12px; }
.submit-row { margin-top: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; background: #ececef; border-radius: 15px; }
.submit-row span { color: var(--muted); font-size: 10px; }
.error-summary { margin-top: 16px; padding: 14px 16px; color: #7a1b13; background: #fff1ef; border: 1px solid #f0b9b2; border-radius: 14px; font-size: 12px; }
.error-summary strong { font-size: 13px; }
.error-summary ul { margin: 7px 0 0; padding-left: 20px; }

.result-area, .comparison-area { margin-top: 20px; }
.result-placeholder { min-height: 260px; display: grid; place-items: center; align-content: center; text-align: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-panel); }
.result-placeholder > span { width: 54px; height: 54px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); border-radius: 17px; font-size: 22px; }
.result-placeholder h2 { margin: 13px 0 2px; font-size: 18px; }
.result-placeholder p { margin: 0; color: var(--muted); font-size: 12px; }
.section-title { margin-bottom: 12px; display: flex; align-items: flex-end; justify-content: space-between; }
.section-title h2 { margin: 0; color: var(--text-strong); font-size: 24px; letter-spacing: -.03em; }
.section-title > span { color: var(--muted); font-size: 12px; }
.result-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.result-summary-card {
  min-width: 0;
  min-height: 216px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  color: var(--text);
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-panel);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.result-summary-card:hover { border-color: #aab9c7; box-shadow: 0 1px 2px rgba(15,31,51,.04), 0 14px 34px rgba(15,31,51,.07); }
.result-summary-card[data-metric-group="income"] { border-color: #cfe9da; }
.result-summary-card[data-metric-group="cost"] { border-color: #f0d0cc; }
.result-summary-card[data-metric-group="cashflow"] { border-color: #c9ddf5; }
.result-summary-card[data-metric-group="price"] { border-color: #d9d3f5; }
.result-summary-index { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .07em; }
.result-summary-name { margin-top: 4px; font-size: 16px; overflow-wrap: anywhere; }
.result-summary-primary { margin-top: 18px; display: block; }
.result-summary-primary small, .result-summary-secondary small { display: block; color: var(--muted); font-size: 10px; font-weight: 500; }
.result-summary-primary > strong { display: block; margin-top: 4px; font-size: clamp(24px, 2.2vw, 34px); line-height: 1.12; letter-spacing: -.04em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.result-summary-card[data-metric-group="income"] .result-summary-primary > strong { color: var(--income); }
.result-summary-card[data-metric-group="cost"] .result-summary-primary > strong { color: var(--cost); }
.result-summary-card[data-metric-group="cashflow"] .result-summary-primary > strong { color: var(--cashflow); }
.result-summary-card[data-metric-group="price"] .result-summary-primary > strong { color: var(--price); }
.result-summary-secondary { margin-top: 14px; display: grid; gap: 7px; }
.result-summary-secondary > span { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.result-summary-secondary strong { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.result-summary-pending { margin: auto 0; color: var(--muted); font-size: 18px; font-weight: 700; }
.result-summary-link { margin-top: auto; padding-top: 14px; color: var(--accent); font-size: 11px; font-weight: 650; }
.scheme-result, .comparison-area { margin-top: 14px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); box-shadow: 0 1px 2px rgba(15,31,51,.03); }
.detail-pending { min-height: 190px; margin-top: 16px; display: grid; place-content: center; text-align: center; background: var(--surface-soft); border: 1px dashed var(--line-strong); border-radius: 14px; }
.detail-pending strong { font-size: 18px; }
.detail-pending p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
.result-heading { display: flex; align-items: baseline; gap: 8px; }
.result-heading span { color: var(--accent); font-size: 11px; font-weight: 720; }
.result-heading h3 { margin: 0; font-size: 18px; }
.metric-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.metric-card { min-height: 110px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; background: var(--surface-soft); border: 1px solid transparent; border-radius: 15px; }
.metric-card[data-metric-group="income"] { color: var(--income); background: var(--income-soft); border-color: #d9eee2; }
.metric-card[data-metric-group="cost"] { color: var(--cost); background: var(--cost-soft); border-color: #f2d8d4; }
.metric-card[data-metric-group="cashflow"] { color: var(--cashflow); background: var(--cashflow-soft); border-color: #d4e5f3; }
.metric-card[data-metric-group="price"] { color: var(--price); background: var(--price-soft); border-color: #dfdaf5; }
.metric-card span { color: var(--muted); font-size: 11px; }
.metric-card strong { font-size: clamp(18px, 1.35vw, 26px); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; overflow-wrap: normal; word-break: keep-all; }
.breakdown-grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.breakdown-group { padding: 14px; background: var(--surface-soft); border: 1px solid #e7e7ea; border-radius: 14px; }
.breakdown-group h4 { margin: 0 0 11px; font-size: 13px; }
.breakdown-group > p { color: var(--muted); font-size: 10px; }
.breakdown-row { padding: 8px 0; border-top: 1px solid #e8e8eb; }

  function requiredFinite(value, label) {

      (typeof value === "string" && value.trim() === "")

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const date = new Date(Date.UTC(year, month - 1, day));
    if (
      date.getUTCFullYear() !== year ||
      date.getUTCMonth() !== month - 1 ||
      date.getUTCDate() !== day

    }

  }

      warnings.push("信用证到期日早于预计付款日");
    }

    let forwardTradeDate;
    let forwardDeliveryDate;
    if (withForward) {
      forwardTradeDate = m.requiredDate(values.forwardTradeDate, "远期交易日");
      forwardDeliveryDate = m.requiredDate(values.forwardDeliveryDate, "远期交割日");
      if (m.daysBetween(forwardTradeDate, forwardDeliveryDate) < 0) {
        throw new Error("远期交割日不得早于远期交易日");
      }
      if (forwardDeliveryDate !== expectedPaymentDate) {
        warnings.push("远期交割日与预计付款日不一致");
      }
    }

    return {
      issueDate,
      expectedPaymentDate,
      lcExpiryDate,
      depositStartDate,
      depositReleaseDate,
      forwardTradeDate,
      forwardDeliveryDate,
      depositDays,
      warnings
    };
  }

  function opportunityCostResult(treatment, annualRate, principal, days, dayBasis) {
    if (treatment === "未确认") return { complete: false, amount: undefined };
    if (treatment === "确认按0") return { complete: true, amount: 0 };
    if (treatment === "计入") {
      const rate = m.nonNegative(annualRate, "机会成本年利率");
      return { complete: true, amount: principal * rate * days / dayBasis };
    }
    throw new Error("资金机会成本处理方式无效");
  }

  function letterOfCreditSameCurrency(input) {
    const values = inputOf(input);
    const lcNominalAmount = m.positive(values.lcNominalAmount, "信用证名义金额");
    const expectedPaymentPrincipal = m.positive(values.expectedPaymentPrincipal, "预计到期应付本金");
    const dates = validateLcDates(values, false);
    const dayBasis = m.basis(values.dayBasis);
    let depositPrincipal;
    if (values.depositInputMode === "按比例") {
      depositPrincipal = expectedPaymentPrincipal * m.ratio(values.depositRatio, "保证金比例");
    } else if (values.depositInputMode === "按金额") {
      depositPrincipal = m.nonNegative(values.depositPrincipal, "保证金本金");
    } else {
      throw new Error("保证金输入方式只能为按比例或按金额");
    }
    const principalAvailable = paymentAvailability(values.principalAvailableAtPayment, "付款日保证金本金可用性");
    const interestAvailable = paymentAvailability(values.interestAvailableAtPayment, "付款日保证金利息可用性");
    const additionalFundsAtMaturity = m.nonNegative(values.additionalFundsAtMaturity, "到期额外补入资金");
    const depositAnnualRate = m.nonNegative(values.depositAnnualRate, "保证金存款年利率");
    const openingFeeRate = m.nonNegative(values.openingFeeRate, "开证手续费率");
    const otherFees = m.nonNegative(values.otherFees, "其他费用");
    const openingFeeTiming = requiredFeeTiming(values.openingFeeTiming, "开证手续费收取时点");
    const otherFeeTiming = requiredFeeTiming(values.otherFeeTiming, "其他费用收取时点");
    let acceptanceFeeRate;
    let acceptanceFeeTiming;
    if (values.paymentMethod === "远期承兑") {
      acceptanceFeeRate = m.nonNegative(values.acceptanceFeeRate, "承兑手续费率");
      acceptanceFeeTiming = requiredFeeTiming(values.acceptanceFeeTiming, "承兑手续费收取时点");
    }
    const feeTaxTreatment = feeTaxTreatmentResult(values.feeTaxTreatment);

    const depositInterest = depositPrincipal * depositAnnualRate * dates.depositDays / dayBasis;
    const depositFutureValue = depositPrincipal + depositInterest;
    const openingFee = lcNominalAmount * openingFeeRate;
    const acceptanceFee = values.paymentMethod === "远期承兑"
      ? lcNominalAmount * acceptanceFeeRate
      : 0;
    const totalFees = openingFee + acceptanceFee + otherFees;
    const feesDueAtPayment = (feeIsDueAtPayment(openingFeeTiming) ? openingFee : 0)
      + (feeIsDueAtPayment(acceptanceFeeTiming) ? acceptanceFee : 0)
      + (feeIsDueAtPayment(otherFeeTiming) ? otherFees : 0);
    const paymentAvailable = additionalFundsAtMaturity
      + (principalAvailable ? depositPrincipal : 0)
      + (interestAvailable ? depositInterest : 0);
    const paymentLiquidityBalance = paymentAvailable - expectedPaymentPrincipal - feesDueAtPayment;
    const finalBalance = depositFutureValue
      + additionalFundsAtMaturity
      - expectedPaymentPrincipal
      - feesDueAtPayment;
    const opportunity = opportunityCostResult(
      values.opportunityCostTreatment,
      values.opportunityCostAnnualRate,
      depositPrincipal,
      dates.depositDays,
      dayBasis
    );
    const additionalNetCost = opportunity.complete && feeTaxTreatment.complete
      ? totalFees + opportunity.amount - depositInterest
      : undefined;
    const warnings = dates.warnings.slice();
    if (paymentLiquidityBalance < 0) warnings.push("到期付款存在流动性缺口");
    if (finalBalance < 0) warnings.push("保证金本息及补入资金不足覆盖到期付款");
    if (!opportunity.complete) warnings.push("资金机会成本口径尚未确认");
    if (!feeTaxTreatment.complete) warnings.push("费用税费口径待确认，净指标暂不展示");
    const currency = currencyOf(values, "CNY");
    const cashflowTimeline = [
      timelineItem(dates.depositStartDate, "保证金存入", "保证金本金", -depositPrincipal, currency, "保证金"),
      timelineItem(
        feeIsDueAtPayment(openingFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "开证手续费",
        openingFeeTiming,
        -openingFee,
        currency,
        "费用"
      ),
      timelineItem(
        feeIsDueAtPayment(acceptanceFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "承兑手续费",
        acceptanceFeeTiming || "不适用",
        -acceptanceFee,
        currency,
        "费用"
      ),
      timelineItem(
        feeIsDueAtPayment(otherFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "其他费用",
        otherFeeTiming,
        -otherFees,
        currency,
        "费用"
      ),
      timelineItem(dates.depositReleaseDate, "保证金本息释放", "本金加利息", depositFutureValue, currency, "保证金"),
      timelineItem(dates.expectedPaymentDate, "信用证付款", "预计付款本金", -expectedPaymentPrincipal, currency, "付款"),
      timelineItem(dates.expectedPaymentDate, "到期补入", "额外补入资金", additionalFundsAtMaturity, currency, "补入")
    ];
    return {
      lcNominalAmount,
      expectedPaymentPrincipal,
      depositPrincipal,
      depositDays: dates.depositDays,
      depositInterest,
      depositFutureValue,
      openingFee,
      acceptanceFee,
      otherFees,
      fixedFees: otherFees,
      totalFees,
      feesDueAtPayment,
      paymentAvailable,
      paymentLiquidityBalance,
      finalBalance,
      opportunityCost: opportunity.amount,
      additionalNetCost,
      warnings,
      cashflowTimeline,
      currency,
      depositAmount: depositPrincipal,
      depositIncome: depositInterest,
      netCashCost: additionalNetCost
    };
  }

  function letterOfCreditCrossCurrency(input) {
    const values = inputOf(input);
    const lcNominalCny = m.positive(values.lcNominalCny, "人民币信用证名义金额");
    const expectedPaymentCny = m.positive(values.expectedPaymentCny, "预计到期应付人民币本金");
    const customerUsdDeposit = m.positive(values.customerUsdDeposit, "客户美元存款");
    const pledgedUsd = m.nonNegative(values.pledgedUsd, "实际质押美元");
    if (pledgedUsd > customerUsdDeposit) {
      throw new Error("实际质押美元不得超过客户美元存款");
    }
    const dates = validateLcDates(values, true);
    const dayBasis = m.basis(values.dayBasis);
    const pledgeRecognitionRatio = m.ratio(values.pledgeRecognitionRatio, "质押认定比例");
    const hedgeRatio = m.ratio(values.hedgeRatio, "锁汇覆盖率");
    const principalAvailable = paymentAvailability(values.principalAvailableAtPayment, "付款日保证金本金可用性");
    const interestAvailable = paymentAvailability(values.interestAvailableAtPayment, "付款日保证金利息可用性");
    const additionalUsdAtMaturity = m.nonNegative(values.additionalUsdAtMaturity, "到期额外补入美元");
    const pledgeReferenceRate = m.positive(values.pledgeReferenceRate, "质押参考折算价");
    const spotReferenceRate = m.positive(values.spotReferenceRate, "期初即期参考折算价");
    const usdDepositAnnualRate = m.nonNegative(values.usdDepositAnnualRate, "美元保证金年利率");
    const forwardSettlementRate = hedgeRatio === 0
      ? undefined
      : m.positive(values.forwardSettlementRate, "远期结汇锁定价");
    const maturitySpotAssumption = hedgeRatio === 1
      ? undefined
      : m.positive(values.maturitySpotAssumption, "未锁部分到期即期假设");
    const openingFeeCny = m.nonNegative(values.openingFeeCny, "开证费用人民币");
    const otherFeesCny = m.nonNegative(values.otherFeesCny, "其他人民币费用");
    const otherFeesUsd = m.nonNegative(values.otherFeesUsd, "其他美元费用");
    const feeConversionRate = m.positive(values.feeConversionRate, "费用折算汇率");
    const openingFeeTiming = requiredFeeTiming(values.openingFeeTiming, "开证费用收取时点");
    const otherCnyFeeTiming = requiredFeeTiming(values.otherCnyFeeTiming, "其他人民币费用收取时点");
    const otherUsdFeeTiming = requiredFeeTiming(values.otherUsdFeeTiming, "其他美元费用收取时点");
    let acceptanceFeeCny = 0;
    let acceptanceFeeTiming;
    if (values.paymentMethod === "远期承兑") {
      acceptanceFeeCny = m.nonNegative(values.acceptanceFeeCny, "承兑费用人民币");
      acceptanceFeeTiming = requiredFeeTiming(values.acceptanceFeeTiming, "承兑费用收取时点");
    }
    const feeTaxTreatment = feeTaxTreatmentResult(values.feeTaxTreatment);

    const cnyFeesDueAtPayment = (feeIsDueAtPayment(openingFeeTiming) ? openingFeeCny : 0)
      + (feeIsDueAtPayment(acceptanceFeeTiming) ? acceptanceFeeCny : 0)
      + (feeIsDueAtPayment(otherCnyFeeTiming) ? otherFeesCny : 0);
    const usdFeesDueAtPayment = feeIsDueAtPayment(otherUsdFeeTiming) ? otherFeesUsd : 0;
    const totalFeesCny = openingFeeCny + acceptanceFeeCny + otherFeesCny;
    const totalFeesUsdEquivalent = totalFeesCny / feeConversionRate + otherFeesUsd;
    const pledgeRecognizedCny = pledgedUsd * pledgeReferenceRate * pledgeRecognitionRatio;
    const pledgeCoverage = pledgeRecognizedCny / expectedPaymentCny;
    const pledgeRatio = pledgedUsd / customerUsdDeposit;
    const hedgeTargetCny = expectedPaymentCny
      + (values.hedgeBasis === "本金及到期CNY费用" ? cnyFeesDueAtPayment : 0);
    const lockedCny = hedgeTargetCny * hedgeRatio;
    const hedgedUsdSold = hedgeRatio === 0 ? 0 : lockedCny / forwardSettlementRate;
    const unhedgedCny = hedgeTargetCny * (1 - hedgeRatio);
    const unhedgedUsdSold = hedgeRatio === 1 ? 0 : unhedgedCny / maturitySpotAssumption;
    const referenceUsdEquivalent = hedgeTargetCny / spotReferenceRate;
    const fxReferenceDifference = referenceUsdEquivalent - hedgedUsdSold - unhedgedUsdSold;
    const depositInterest = pledgedUsd * usdDepositAnnualRate * dates.depositDays / dayBasis;
    const depositFutureValue = pledgedUsd + depositInterest;
    const grossStructureDifference = depositInterest + fxReferenceDifference;
    const finalBalance = depositFutureValue
      + additionalUsdAtMaturity
      - hedgedUsdSold
      - unhedgedUsdSold
      - usdFeesDueAtPayment;
    const paymentAvailable = additionalUsdAtMaturity
      + (principalAvailable ? pledgedUsd : 0)
      + (interestAvailable ? depositInterest : 0);
    const paymentLiquidityBalance = paymentAvailable
      - hedgedUsdSold
      - unhedgedUsdSold
      - usdFeesDueAtPayment;
    const opportunity = opportunityCostResult(
      values.opportunityCostTreatment,
      values.opportunityCostAnnualRate,
      pledgedUsd,
      dates.depositDays,
      dayBasis
    );
    const netStructureDifference = opportunity.complete && feeTaxTreatment.complete
      ? grossStructureDifference - totalFeesUsdEquivalent - opportunity.amount
      : undefined;
    const annualizedNetReturn = netStructureDifference !== undefined
      && additionalUsdAtMaturity === 0
      && paymentLiquidityBalance >= 0
      && pledgedUsd > 0
      && dates.depositDays > 0
      ? netStructureDifference / pledgedUsd * dayBasis / dates.depositDays
      : undefined;
    const warnings = dates.warnings.slice();
    if (pledgeCoverage < 1) warnings.push("质押认定金额未覆盖预计付款人民币");
    if (paymentLiquidityBalance < 0) warnings.push("到期美元付款存在资金缺口");
    if (!opportunity.complete) warnings.push("资金机会成本口径尚未确认");
    if (!feeTaxTreatment.complete) warnings.push("费用税费口径待确认，净指标暂不展示");
    if (hedgeRatio < 1) warnings.push("未锁部分结果依赖到期即期假设");
    const cashflowTimeline = [
      timelineItem(dates.depositStartDate, "美元保证金质押", "实际质押美元", -pledgedUsd, "USD", "保证金"),
      timelineItem(
        feeIsDueAtPayment(openingFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "开证费用",
        openingFeeTiming,
        -openingFeeCny,
        "CNY",
        "费用"
      ),
      timelineItem(
        feeIsDueAtPayment(acceptanceFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "承兑费用",
        acceptanceFeeTiming || "不适用",
        -acceptanceFeeCny,
        "CNY",
        "费用"
      ),
      timelineItem(
        feeIsDueAtPayment(otherCnyFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "其他人民币费用",
        otherCnyFeeTiming,
        -otherFeesCny,
        "CNY",
        "费用"
      ),
      timelineItem(
        feeIsDueAtPayment(otherUsdFeeTiming) ? dates.expectedPaymentDate : dates.issueDate,
        "其他美元费用",
        otherUsdFeeTiming,
        -otherFeesUsd,
        "USD",
        "费用"
      ),
      timelineItem(dates.depositReleaseDate, "美元保证金本息释放", "本金加利息", depositFutureValue, "USD", "保证金"),
      timelineItem(
        dates.forwardTradeDate,
        "远期结汇锁价",
        hedgeRatio === 0 ? "未锁汇" : `锁定价 ${forwardSettlementRate} CNY/USD`,
        0,
        "CNY/USD",
        "结汇"
      ),
      timelineItem(dates.forwardDeliveryDate, "远期结汇卖出美元", "已锁部分卖出美元", -hedgedUsdSold, "USD", "结汇"),
      timelineItem(dates.forwardDeliveryDate, "远期结汇取得人民币", "已锁部分取得人民币", lockedCny, "CNY", "结汇"),
      timelineItem(dates.expectedPaymentDate, "未锁部分结汇", "按到期即期假设卖出美元", -unhedgedUsdSold, "USD", "结汇"),
      timelineItem(dates.expectedPaymentDate, "未锁部分结汇取得人民币", "未锁部分取得人民币", unhedgedCny, "CNY", "结汇"),
      timelineItem(dates.expectedPaymentDate, "支付人民币信用证本金", "预计付款人民币本金", -expectedPaymentCny, "CNY", "付款"),
      timelineItem(dates.expectedPaymentDate, "到期补入", "额外补入美元", additionalUsdAtMaturity, "USD", "补入")
    ];
    return {
      lcNominalCny,
      expectedPaymentCny,
      customerUsdDeposit,
      pledgedUsd,
      pledgeRecognizedCny,
      pledgeCoverage,
      pledgeRatio,
      depositDays: dates.depositDays,
      depositInterest,
      depositFutureValue,
      openingFeeCny,
      acceptanceFeeCny,
      otherFeesCny,
      otherFeesUsd,
      cnyFeesDueAtPayment,
      usdFeesDueAtPayment,
      totalFeesCny,
      totalFeesUsdEquivalent,
      opportunityCostUsd: opportunity.amount,
      hedgeTargetCny,
      lockedCny,
      hedgedUsdSold,
      unhedgedCny,
      unhedgedUsdSold,
      referenceUsdEquivalent,
      fxReferenceDifference,
      grossStructureDifference,
      netStructureDifference,
      annualizedNetReturn,
      finalBalance,
      paymentAvailable,
      paymentLiquidityBalance,
      warnings,
      cashflowTimeline,
      currency: "USD",
      foreignCurrency: "USD"
    };
  }

  function dateAfterDays(startDate, days) {
    const start = m.requiredDate(startDate, "起始日");
    const duration = m.positive(days, "保证金占用天数");
    const date = new Date(`${start}T00:00:00Z`);
    date.setUTCDate(date.getUTCDate() + duration);
    return date.toISOString().slice(0, 10);
  }

  function letterOfCredit(input) {
    const values = inputOf(input);
    if (values.expectedPaymentPrincipal !== undefined) {
      return letterOfCreditSameCurrency(values);
    }
    const lcAmount = m.positive(values.lcAmount, "信用证金额");
    const depositRatio = m.ratio(values.depositRatio, "保证金比例");
    const startDate = "2000-01-01";
    const endDate = dateAfterDays(startDate, values.validityDays);
    return letterOfCreditSameCurrency({
      lcNominalAmount: lcAmount,
      expectedPaymentPrincipal: lcAmount,
      currency: values.currency,
      paymentMethod: "远期承兑",
      issueDate: startDate,
      expectedPaymentDate: endDate,
      lcExpiryDate: endDate,
      depositStartDate: startDate,
      depositReleaseDate: endDate,
      dayBasis: values.dayBasis,
      depositInputMode: "按比例",
      depositRatio,
      depositPrincipal: 0,
      principalAvailableAtPayment: "不计入",
      interestAvailableAtPayment: "不计入",
      additionalFundsAtMaturity: 0,
      depositAnnualRate: values.depositAnnualRate,
      openingFeeRate: values.openingFeeRate,
      openingFeeTiming: "开证日",
      acceptanceFeeRate: values.acceptanceFeeRate,
      acceptanceFeeTiming: "开证日",
      otherFees: values.fixedFees,
      otherFeeTiming: "开证日",
      feeTaxTreatment: "含税",
      opportunityCostTreatment: "确认按0",
      opportunityCostAnnualRate: 0
    });
  }

  function tradeFinance(input) {
    const values = inputOf(input);
    const baseAmount = m.positive(values.baseAmount, "业务基础金额");
    const financingRatio = positiveFinancingRatio(values.financingRatio);
    const days = m.positive(values.days, "融资天数");
    const annualRate = m.nonNegative(values.annualRate, "融资年利率");
    const feeRate = m.nonNegative(values.feeRate, "手续费率");
    const fixedFees = m.nonNegative(values.fixedFees, "其他固定费用");
    const dayBasis = m.basis(values.dayBasis);

    const financingAmount = baseAmount * financingRatio;
    const interest = financingAmount * annualRate * days / dayBasis;
    const variableFee = financingAmount * feeRate;
    const totalCost = interest + variableFee + fixedFees;
    return {
      financingAmount,
      interest,
      variableFee,
      fixedFees,
      totalCost,
      netProceeds: financingAmount - variableFee - fixedFees,
      maturityPayment: financingAmount + interest,
      annualizedCostRate: annualizedCost(totalCost, financingAmount, days, dayBasis),
      currency: currencyOf(values, "CNY")
    };
  }

  function forfaiting(input) {
    const values = inputOf(input);
    const faceAmount = m.positive(values.faceAmount, "应收款面值");
    const discountRate = m.nonNegative(values.discountRate, "年贴现率");
    const days = m.positive(values.days, "贴现剩余天数");
    const fixedFees = m.nonNegative(values.fixedFees, "其他固定费用");
    const dayBasis = m.basis(values.dayBasis);

    const discountInterest = faceAmount * discountRate * days / dayBasis;
    const totalCost = discountInterest + fixedFees;
    return {
      discountInterest,
      fixedFees,
      totalCost,
      netProceeds: faceAmount - totalCost,
      costRate: faceAmount === 0 ? 0 : totalCost / faceAmount,
      currency: currencyOf(values, "CNY")
    };
  }

  function guarantee(input) {
    const values = inputOf(input);
    const guaranteeAmount = m.positive(values.guaranteeAmount, "保函金额");
    const guaranteeFeeRate = m.nonNegative(values.guaranteeFeeRate, "保函年费率");
    const days = m.positive(values.days, "保函有效天数");
    const depositRatio = m.ratio(values.depositRatio, "保证金比例");
    const depositAnnualRate = m.nonNegative(values.depositAnnualRate, "保证金存款年利率");
    const fixedFees = m.nonNegative(values.fixedFees, "其他固定费用");
    const dayBasis = m.basis(values.dayBasis);

    const guaranteeFee = guaranteeAmount * guaranteeFeeRate * days / dayBasis;
    const depositAmount = guaranteeAmount * depositRatio;
    const depositIncome = depositAmount * depositAnnualRate * days / dayBasis;
    const totalFees = guaranteeFee + fixedFees;
    const netCashCost = totalFees - depositIncome;
    return {
      guaranteeFee,
      depositAmount,
      depositIncome,
      fixedFees,
      totalFees,
      netCashCost,
      netCostRate: annualizedCost(netCashCost, guaranteeAmount, days, dayBasis),
      currency: currencyOf(values, "CNY")
    };
  }

  function loan(input) {
    const values = inputOf(input);
    if (values.repaymentMethod && values.repaymentMethod !== "bullet") {
      throw new Error("仅支持到期一次还本付息");
    }
    const principal = m.positive(values.principal, "贷款本金");
    const annualRate = m.nonNegative(values.annualRate, "贷款年利率");
    const months = m.positive(values.months, "贷款期限");
    const feeRate = m.nonNegative(values.feeRate, "手续费率");
    const fixedFees = m.nonNegative(values.fixedFees, "其他固定费用");

    const totalInterest = principal * annualRate * months / 12;
    const variableFee = principal * feeRate;
    const totalCost = totalInterest + variableFee + fixedFees;
    return {
      totalInterest,
      variableFee,
      fixedFees,
      totalCost,
      netProceeds: principal - variableFee - fixedFees,
      maturityPayment: principal + totalInterest,
      annualizedCostRate: principal === 0 ? 0 : totalCost / principal / months * 12,
      currency: currencyOf(values, "CNY")
    };
  }

  function importRmbPath(input) {
    const values = inputOf(input);
    const financedForeign = m.positive(values.foreignAmount, "付款金额") * positiveFinancingRatio(values.financingRatio);
    const spotRate = m.positive(values.spotRate, "即期购汇汇率");
    const annualRate = m.nonNegative(values.annualRate, "融资年利率");
    const days = m.positive(values.days, "融资天数");
    const dayBasis = m.basis(values.dayBasis);
    const feeRate = m.nonNegative(values.feeRate, "手续费率");
    const fixedFeesRmb = m.nonNegative(values.fixedFeesRmb, "固定费用");
    const principalRmb = financedForeign * spotRate;
    const interestRmb = principalRmb * annualRate * days / dayBasis;
    const feeRmb = principalRmb * feeRate + fixedFeesRmb;
    const totalRmbPayment = principalRmb + interestRmb + feeRmb;
    return {
      financedForeign,
      principalRmb,
      interestRmb,
      feeRmb,
      totalRmbPayment,
      annualizedCostRate: annualizedCost(interestRmb + feeRmb, principalRmb, days, dayBasis),
      currency: "CNY",
      foreignCurrency: foreignCurrencyOf(values)
    };
  }

  function importFxPath(input) {
    const values = inputOf(input);
    const principalForeign = m.positive(values.foreignAmount, "付款金额") * positiveFinancingRatio(values.financingRatio);
    const annualRate = m.nonNegative(values.annualRate, "融资年利率");
    const days = m.positive(values.days, "融资天数");
    const dayBasis = m.basis(values.dayBasis);
